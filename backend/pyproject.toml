[project]
name = "chronicle-backend"
version = "0.1.0"
description = "Chronicle deterministic generation backend (Phase C)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.9",
    "httpx>=0.27",
    "uvicorn>=0.35,<1",
    # P2: orchestration migrates to an explicit LangGraph state graph (ADR-003
    # "explicit state machines, no autonomous swarms"). OSS/local library, no
    # paid infra -- the free-development constraint (AGENTS.md 5) still holds.
    "langgraph>=1.2,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
chronicle = "chronicle.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local_ollama_integration: requires a real local Ollama daemon reachable at CHRONICLE_OLLAMA_BASE_URL; excluded from the default run (see addopts). Invoke explicitly with `pytest -m local_ollama_integration -s`. Skips itself (does not fail) when Ollama is unreachable.",
    "live_network_integration: hits real free source APIs (Wikipedia, Gutenberg, Internet Archive); excluded from the default run. Invoke explicitly with `pytest -m live_network_integration -s`. Skips itself (does not fail) when the network is unreachable.",
]
addopts = "-m 'not local_ollama_integration and not live_network_integration'"
